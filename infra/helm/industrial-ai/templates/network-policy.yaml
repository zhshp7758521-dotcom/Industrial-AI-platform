apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industrial-ai.name" . }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: industrial-ai
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: industrial-ai

