apiVersion: v1
kind: Service
metadata:
  name: {{ include "industrial-ai.name" . }}-gateway
  labels:
    {{- include "industrial-ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "industrial-ai.name" . }}-gateway
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http

