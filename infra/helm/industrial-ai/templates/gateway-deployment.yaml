apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "industrial-ai.name" . }}-gateway
  labels:
    {{- include "industrial-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "industrial-ai.name" . }}-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "industrial-ai.name" . }}-gateway
        {{- include "industrial-ai.labels" . | nindent 8 }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /ready, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true

